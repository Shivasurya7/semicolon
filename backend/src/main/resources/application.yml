# Base configuration, shared by every profile (dev, test, staging, prod).
# Secrets and per-environment values come only from the environment (see /.env.example).
# A missing required key stops startup with an error naming it, e.g. "Could not resolve placeholder 'DB_URL'".
spring:
  application:
    name: semicolan-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness and /actuator/health/readiness
      show-details: never
